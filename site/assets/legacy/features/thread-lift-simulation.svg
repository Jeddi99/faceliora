<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#edf4f7"/><g font-family="Inter,Arial,sans-serif" fill="#253940"><text x="65" y="82" font-size="16" fill="#366d87">THREAD-LIFT SIMULATION ON A 3D SCAN</text><text x="65" y="144" font-size="44">Slack taken up to the taut line, no further.</text><rect x="65" y="206" width="560" height="390" rx="8" fill="white"/><path d="M115 300H575" stroke="#247eaa" stroke-width="4" stroke-dasharray="14 10" fill="none"/><path d="M115 300C215 300 245 470 345 470S475 300 575 300" stroke="#9aaab0" stroke-width="4" fill="none"/><path d="M235 408V316" stroke="#366d87" stroke-width="3" fill="none"/><path d="M226 330L235 314L244 330" stroke="#366d87" stroke-width="3" fill="none"/><path d="M345 450V316" stroke="#366d87" stroke-width="3" fill="none"/><path d="M336 330L345 314L354 330" stroke="#366d87" stroke-width="3" fill="none"/><path d="M455 408V316" stroke="#366d87" stroke-width="3" fill="none"/><path d="M446 330L455 314L464 330" stroke="#366d87" stroke-width="3" fill="none"/><text x="115" y="276" font-size="18" fill="#247eaa">TAUT LINE</text><text x="250" y="520" font-size="18" fill="#6b7c83">SKIN THAT HANGS</text><text x="94" y="572" font-size="19" fill="#6b7c83">Lifted back to the line · never pushed inward</text><rect x="665" y="206" width="470" height="390" rx="8" fill="white"/><text x="694" y="252" font-size="18" fill="#366d87">THREADS</text><text x="694" y="300" font-size="22">Jawline</text><text x="694" y="340" font-size="22">Under-chin</text><text x="694" y="380" font-size="22">Cheek</text><text x="694" y="420" font-size="22">Nasolabial fold</text><text x="694" y="460" font-size="22">Mouth corner</text><text x="694" y="500" font-size="22">Brow</text><text x="694" y="540" font-size="22">Eye tail</text><text x="65" y="660" font-size="16" fill="#6b7c83">A face with little laxity changes little, by design. Not a guaranteed result.</text><text x="65" y="700" font-size="13" fill="#6b7c83">EXPLANATORY DIAGRAM · NOT A PATIENT IMAGE OR PRODUCT SCREENSHOT</text></g></svg>