<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#edf4f7"/><g font-family="Inter,Arial,sans-serif" fill="#253940"><text x="65" y="82" font-size="16" fill="#366d87">SURGERY SIMULATION ON A 3D SCAN</text><text x="65" y="144" font-size="44">13 zones on the client’s own scan.</text><rect x="65" y="206" width="200" height="74" rx="8" fill="white"/><text x="83" y="250" font-size="15" fill="#366d87">01</text><text x="117" y="251" font-size="18">Forehead</text><rect x="281" y="206" width="200" height="74" rx="8" fill="white"/><text x="299" y="250" font-size="15" fill="#366d87">02</text><text x="333" y="251" font-size="18">Brows</text><rect x="497" y="206" width="200" height="74" rx="8" fill="white"/><text x="515" y="250" font-size="15" fill="#366d87">03</text><text x="549" y="251" font-size="18">Sub-brow</text><rect x="713" y="206" width="200" height="74" rx="8" fill="white"/><text x="731" y="250" font-size="15" fill="#366d87">04</text><text x="765" y="251" font-size="18">Temples</text><rect x="929" y="206" width="200" height="74" rx="8" fill="white"/><text x="947" y="250" font-size="15" fill="#366d87">05</text><text x="981" y="251" font-size="18">Eyes</text><rect x="65" y="298" width="200" height="74" rx="8" fill="white"/><text x="83" y="342" font-size="15" fill="#366d87">06</text><text x="117" y="343" font-size="18">Under-eye</text><rect x="281" y="298" width="200" height="74" rx="8" fill="white"/><text x="299" y="342" font-size="15" fill="#366d87">07</text><text x="333" y="343" font-size="18">Nose</text><rect x="497" y="298" width="200" height="74" rx="8" fill="white"/><text x="515" y="342" font-size="15" fill="#366d87">08</text><text x="549" y="343" font-size="18">Cheeks</text><rect x="713" y="298" width="200" height="74" rx="8" fill="white"/><text x="731" y="342" font-size="15" fill="#366d87">09</text><text x="765" y="343" font-size="18">Folds</text><rect x="929" y="298" width="200" height="74" rx="8" fill="white"/><text x="947" y="342" font-size="15" fill="#366d87">10</text><text x="981" y="343" font-size="18">Lips</text><rect x="65" y="390" width="200" height="74" rx="8" fill="white"/><text x="83" y="434" font-size="15" fill="#366d87">11</text><text x="117" y="435" font-size="18">Chin</text><rect x="281" y="390" width="200" height="74" rx="8" fill="white"/><text x="299" y="434" font-size="15" fill="#366d87">12</text><text x="333" y="435" font-size="18">Jaw line</text><rect x="497" y="390" width="200" height="74" rx="8" fill="white"/><text x="515" y="434" font-size="15" fill="#366d87">13</text><text x="549" y="435" font-size="18">Under the chin</text><rect x="713" y="390" width="422" height="74" rx="8" fill="#dbe9ef"/><text x="741" y="422" font-size="18">Sliders in millimetres</text><text x="741" y="448" font-size="18" fill="#366d87">Both sides or one</text><rect x="65" y="500" width="1070" height="100" rx="8" fill="white"/><text x="94" y="544" font-size="18" fill="#366d87">LAYERS</text><text x="94" y="580" font-size="22">“Nose only” · “nose with chin”: show, hide and compare with the original scan</text><text x="65" y="648" font-size="16" fill="#6b7c83">Held to tissue limits in each zone. A simulation for communication, not a guaranteed result.</text><text x="65" y="700" font-size="13" fill="#6b7c83">EXPLANATORY DIAGRAM · NOT A PATIENT IMAGE OR PRODUCT SCREENSHOT</text></g></svg>