<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#edf4f7"/><g font-family="Inter,Arial,sans-serif" fill="#253940"><text x="65" y="82" font-size="16" fill="#366d87">3D SKIN ANALYSIS FROM A FACE SCAN</text><text x="65" y="144" font-size="44">Three simulated lights, one scan.</text><rect x="65" y="206" width="330" height="210" rx="8" fill="white"/><text x="94" y="252" font-size="18" fill="#366d87">01</text><text x="94" y="296" font-size="28">DAYLIGHT</text><text x="94" y="336" font-size="19" fill="#6b7c83">The scan as it is</text><rect x="435" y="206" width="330" height="210" rx="8" fill="white"/><text x="464" y="252" font-size="18" fill="#366d87">02</text><text x="464" y="296" font-size="28">RED LIGHT</text><text x="464" y="336" font-size="19" fill="#6b7c83">Blood under the skin</text><rect x="805" y="206" width="330" height="210" rx="8" fill="white"/><text x="834" y="252" font-size="18" fill="#366d87">03</text><text x="834" y="296" font-size="28">UV, SIMULATED</text><text x="834" y="336" font-size="19" fill="#6b7c83">Pigment, from the</text><text x="834" y="364" font-size="19" fill="#6b7c83">colour scan</text><rect x="65" y="446" width="1070" height="150" rx="8" fill="white"/><text x="94" y="492" font-size="18" fill="#366d87">FOUND ON THE SCAN</text><text x="94" y="532" font-size="21">Pores · blackheads · spots · melasma-like patches · red spots</text><text x="94" y="566" font-size="21">Redness · wrinkles · folds and tear troughs measured in 3D</text><text x="65" y="660" font-size="16" fill="#6b7c83">Amounts: a few, some, many. For a clinician’s review, not a diagnosis.</text><text x="65" y="700" font-size="13" fill="#6b7c83">EXPLANATORY DIAGRAM · NOT A PATIENT IMAGE OR PRODUCT SCREENSHOT</text></g></svg>