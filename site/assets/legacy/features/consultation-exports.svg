<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#edf4f7"/><g font-family="Inter,Arial,sans-serif" fill="#253940"><text x="65" y="82" font-size="16" fill="#366d87">CONSULTATION SHEET AND EXPORTS</text><text x="65" y="144" font-size="44">From simulation to consultation sheet.</text><rect x="65" y="206" width="330" height="170" rx="8" fill="white"/><text x="94" y="252" font-size="18" fill="#366d87">01</text><text x="94" y="296" font-size="28">IMAGES</text><text x="94" y="336" font-size="19" fill="#6b7c83">From the 3D model</text><rect x="435" y="206" width="330" height="170" rx="8" fill="white"/><text x="464" y="252" font-size="18" fill="#366d87">02</text><text x="464" y="296" font-size="28">VIDEO</text><text x="464" y="336" font-size="19" fill="#6b7c83">MP4, side by side</text><rect x="805" y="206" width="330" height="170" rx="8" fill="white"/><text x="834" y="252" font-size="18" fill="#366d87">03</text><text x="834" y="296" font-size="28">PDF</text><text x="834" y="336" font-size="19" fill="#6b7c83">To print or send</text><rect x="65" y="406" width="515" height="170" rx="8" fill="white"/><text x="94" y="452" font-size="18" fill="#366d87">04</text><text x="94" y="496" font-size="28">QUOTATION</text><text x="94" y="536" font-size="19" fill="#6b7c83">Prices entered by the clinic</text><rect x="620" y="406" width="515" height="170" rx="8" fill="white"/><text x="649" y="452" font-size="18" fill="#366d87">05</text><text x="649" y="496" font-size="28">TREATMENT RECORD</text><text x="649" y="536" font-size="19" fill="#6b7c83">Planned beside used</text><text x="65" y="636" font-size="16" fill="#6b7c83">Every image, video and PDF carries the simulation watermark.</text><text x="65" y="700" font-size="13" fill="#6b7c83">EXPLANATORY DIAGRAM · NOT A PATIENT IMAGE OR PRODUCT SCREENSHOT</text></g></svg>