<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#edf4f7"/><g font-family="Inter,Arial,sans-serif" fill="#253940"><text x="65" y="82" font-size="16" fill="#366d87">INJECTION SIMULATION ON A 3D SCAN</text><text x="65" y="144" font-size="44">Choose, press, review.</text><rect x="65" y="206" width="330" height="250" rx="8" fill="white"/><text x="94" y="252" font-size="18" fill="#366d87">01</text><text x="94" y="296" font-size="28">CHOOSE</text><text x="94" y="336" font-size="19" fill="#6b7c83">Filler · botulinum toxin</text><text x="94" y="364" font-size="19" fill="#6b7c83">or fat, one tool at a time</text><rect x="435" y="206" width="330" height="250" rx="8" fill="white"/><text x="464" y="252" font-size="18" fill="#366d87">02</text><text x="464" y="296" font-size="28">PRESS</text><text x="464" y="336" font-size="19" fill="#6b7c83">On the scan, where it</text><text x="464" y="364" font-size="19" fill="#6b7c83">would go · held to each</text><text x="464" y="392" font-size="19" fill="#6b7c83">area’s limits</text><rect x="805" y="206" width="330" height="250" rx="8" fill="white"/><text x="834" y="252" font-size="18" fill="#366d87">03</text><text x="834" y="296" font-size="28">REVIEW</text><text x="834" y="336" font-size="19" fill="#6b7c83">The settled result, sized</text><text x="834" y="364" font-size="19" fill="#6b7c83">from published group</text><text x="834" y="392" font-size="19" fill="#6b7c83">measurements</text><rect x="65" y="486" width="1070" height="110" rx="8" fill="white"/><text x="94" y="532" font-size="18" fill="#366d87">THEN</text><text x="94" y="572" font-size="22">Layers · running totals · the consultation sheet lists every injection</text><text x="65" y="660" font-size="16" fill="#6b7c83">A simulation for communication, not a guaranteed result. The physician chooses product and amount.</text><text x="65" y="700" font-size="13" fill="#6b7c83">EXPLANATORY DIAGRAM · NOT A PATIENT IMAGE OR PRODUCT SCREENSHOT</text></g></svg>