<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#edf4f7"/><g font-family="Inter,Arial,sans-serif" fill="#253940"><text x="65" y="82" font-size="16" fill="#366d87">FACIAL DATA</text><text x="65" y="144" font-size="44" fill="#253940">Ask where each copy goes.</text><circle cx="180" cy="344" r="95" fill="white"/><text x="148" y="359" font-size="42" fill="#366d87">01</text><text x="72" y="508" font-size="24" fill="#253940">COLLECT</text><text x="72" y="546" font-size="18" fill="#253940">What is needed?</text><path d="M286 344h34m-9-9 9 9-9 9" stroke="#366d87" fill="none" stroke-width="2"/><circle cx="460" cy="344" r="95" fill="white"/><text x="428" y="359" font-size="42" fill="#366d87">02</text><text x="352" y="508" font-size="24" fill="#253940">USE</text><text x="352" y="546" font-size="18" fill="#253940">For which purpose?</text><path d="M566 344h34m-9-9 9 9-9 9" stroke="#366d87" fill="none" stroke-width="2"/><circle cx="740" cy="344" r="95" fill="white"/><text x="708" y="359" font-size="42" fill="#366d87">03</text><text x="632" y="508" font-size="24" fill="#253940">SHARE</text><text x="632" y="546" font-size="18" fill="#253940">Who can access it?</text><path d="M846 344h34m-9-9 9 9-9 9" stroke="#366d87" fill="none" stroke-width="2"/><circle cx="1020" cy="344" r="95" fill="white"/><text x="988" y="359" font-size="42" fill="#366d87">04</text><text x="912" y="508" font-size="24" fill="#253940">RETAIN</text><text x="912" y="546" font-size="18" fill="#253940">For how long?</text><text x="65" y="658" font-size="20" fill="#6b7c83">Clarify the data journey before using identifiable images or models.</text></g></svg>