<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#edf4f7"/><g font-family="Inter,Arial,sans-serif" fill="#253940"><text x="65" y="82" font-size="16" fill="#366d87">A PHONE 3D SCAN FOR A CONSULTATION</text><text x="65" y="144" font-size="44">Prepare, light, capture, consent.</text><rect x="65" y="206" width="510" height="190" rx="8" fill="white"/><text x="94" y="252" font-size="18" fill="#366d87">01</text><text x="94" y="296" font-size="28">PREPARE</text><text x="94" y="336" font-size="19" fill="#6b7c83">Hair back · a still face</text><text x="94" y="364" font-size="19" fill="#6b7c83">The same expression · no blinking</text><rect x="625" y="206" width="510" height="190" rx="8" fill="white"/><text x="654" y="252" font-size="18" fill="#366d87">02</text><text x="654" y="296" font-size="28">LIGHT</text><text x="654" y="336" font-size="19" fill="#6b7c83">Even room light · no window or side lamp</text><text x="654" y="364" font-size="19" fill="#6b7c83">A grey card in view for colour</text><rect x="65" y="420" width="510" height="190" rx="8" fill="white"/><text x="94" y="466" font-size="18" fill="#366d87">03</text><text x="94" y="510" font-size="28">CAPTURE</text><text x="94" y="550" font-size="19" fill="#6b7c83">Front, left, right, high and low</text><text x="94" y="578" font-size="19" fill="#6b7c83">30–60 clear photos round the face</text><rect x="625" y="420" width="510" height="190" rx="8" fill="white"/><text x="654" y="466" font-size="18" fill="#366d87">04</text><text x="654" y="510" font-size="28">CONSENT</text><text x="654" y="550" font-size="19" fill="#6b7c83">Recorded before the scan is sent</text><text x="654" y="578" font-size="19" fill="#6b7c83">Into the clinic’s own record</text><text x="65" y="672" font-size="16" fill="#6b7c83">A scan records the skin’s surface and colour, not muscle, fat or bone.</text><text x="65" y="700" font-size="13" fill="#6b7c83">EXPLANATORY DIAGRAM · NOT A PATIENT IMAGE OR PRODUCT SCREENSHOT</text></g></svg>
