<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#edf4f7"/><g font-family="Inter,Arial,sans-serif" fill="#253940"><text x="65" y="82" font-size="16" fill="#366d87">FACIAL PHOTOGRAPHS</text><text x="65" y="144" font-size="44" fill="#253940">Make the comparison clearer.</text><rect x="65" y="206" width="330" height="320" rx="8" fill="white"/><g transform="translate(230 345) scale(0.78)" fill="none" stroke="#366d87" stroke-width="3"><path d="M-54 0c0-54 21-83 54-83S54-54 54 0c0 61-27 96-54 96S-54 61-54 0Z"/><path d="M-34-12h21m26 0h21M0-8l-6 32h14M-16 45q16 10 32 0M-24 84v37m48-37v37"/></g><text x="65" y="573" font-size="18" fill="#366d87">LIGHT</text><text x="65" y="610" font-size="15" fill="#253940">Keep light and background consistent.</text><rect x="435" y="206" width="330" height="320" rx="8" fill="white"/><g transform="translate(600 345) scale(0.78)" fill="none" stroke="#366d87" stroke-width="3"><path d="M-54 0c0-54 21-83 54-83S54-54 54 0c0 61-27 96-54 96S-54 61-54 0Z"/><path d="M-34-12h21m26 0h21M0-8l-6 32h14M-16 45q16 10 32 0M-24 84v37m48-37v37"/></g><text x="435" y="573" font-size="18" fill="#366d87">ANGLE</text><text x="435" y="610" font-size="15" fill="#253940">Record front (0°) and side (90°) views.</text><rect x="805" y="206" width="330" height="320" rx="8" fill="white"/><g transform="translate(970 345) scale(0.78)" fill="none" stroke="#366d87" stroke-width="3"><path d="M-54 0c0-54 21-83 54-83S54-54 54 0c0 61-27 96-54 96S-54 61-54 0Z"/><path d="M-34-12h21m26 0h21M0-8l-6 32h14M-16 45q16 10 32 0M-24 84v37m48-37v37"/></g><text x="805" y="573" font-size="18" fill="#366d87">DISTANCE</text><text x="805" y="610" font-size="15" fill="#253940">Avoid changing camera perspective.</text><text x="65" y="675" font-size="16" fill="#6b7c83">A discussion aid. Follow the clinic’s instructions for actual capture.</text></g></svg>